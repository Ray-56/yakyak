name: Bootstrap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' rust-toolchain.toml)"
          [[ -n "$toolchain" && "$toolchain" != *$'\n'* ]]
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Diagnose environment
        run: bash scripts/doctor.sh
      - name: Run shared checks
        run: bash scripts/check.sh
